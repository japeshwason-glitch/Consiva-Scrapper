# Recursive resolver for the lead pipeline.
#
# The pipeline probes 60+ mostly-nonexistent hostnames per company, so it
# sustains ~90 lookups/sec that are overwhelmingly NXDOMAIN. Public resolvers
# (1.1.1.1, 8.8.8.8) are shared infrastructure and throttle that per source IP,
# which surfaced as EAI_AGAIN and cost us live companies.
#
# Recursing ourselves means asking the roots, then Verisign for .com or NIXI
# for .in, then the authoritative server. Those are built for volume and do not
# ration a single modest client, so we stop competing for someone else's quota.

server:
    # Runtime settings the mvance/unbound image would otherwise have written
    # itself. Its entrypoint only generates a config when none exists, so
    # mounting this file replaces the whole thing -- including these.
    directory: "/opt/unbound/etc/unbound"
    username: "_unbound"
    chroot: "/opt/unbound/etc/unbound"
    do-daemonize: no
    logfile: /dev/null
    use-syslog: no

    verbosity: 0
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no            # no IPv6 on this LAN; asking for AAAA doubles queries
    do-udp: yes
    do-tcp: yes

    # Only the compose network may use this resolver. It is not a public one.
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    num-threads: 4
    so-reuseport: yes
    # Headroom for the burst shape above: many outstanding queries, most of
    # which resolve to a denial rather than an address.
    outgoing-range: 8192
    num-queries-per-thread: 4096
    so-rcvbuf: 4m
    so-sndbuf: 4m

    # Caching is where the win is. Our traffic repeats heavily (the same TLD
    # and nameserver set over and over) even though each hostname is unique.
    msg-cache-size: 128m
    rrset-cache-size: 256m
    key-cache-size: 32m
    neg-cache-size: 64m
    cache-min-ttl: 300
    cache-max-negative-ttl: 3600
    prefetch: yes
    prefetch-key: yes

    # DNSSEC validation is OFF, and that is deliberate and measured.
    #
    # With it on, every lookup returned SERVFAIL here. Unbound's log said
    # "failed to prime trust anchor -- DNSKEY rrset is not secure": the DNSKEY
    # responses arrive with their signatures stripped. systemd-resolved on this
    # LAN reports the same thing from the other direction ("DNSSEC=no/
    # unsupported", "degraded feature set UDP instead of UDP+EDNS0"), so
    # something in the path breaks EDNS0, which DNSSEC depends on.
    #
    # The cost is real: aggressive-nsec needs validation, so we lose the
    # cache-a-whole-range-of-nonexistent-names trick that suited this workload
    # best. What remains still solves the actual problem -- we recurse to the
    # roots and TLD servers instead of competing for a public resolver's
    # per-IP quota. Measured: 60/60 junk lookups answered NXDOMAIN with zero
    # failures, the exact burst that was getting us throttled.
    #
    # To re-enable once the network passes EDNS0, restore these three lines and
    # verify with `drill @127.0.0.1 example.com` returning NOERROR not SERVFAIL:
    #   auto-trust-anchor-file: "var/root.key"
    #   aggressive-nsec: yes
    #   harden-dnssec-stripped: yes

    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    # Chromium in the scrape stage resolves plenty of CDNs; keep them warm.
    serve-expired: yes
    serve-expired-ttl: 3600
