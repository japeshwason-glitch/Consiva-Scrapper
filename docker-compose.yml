# Consiva lead pipeline — GB10 deployment.
#
#   docker compose up -d                      postgres + migrations + API only
#   docker compose --profile pipeline up -d    ALSO start the daily scheduler
#
# The scheduler sits behind a profile so bringing the API up cannot accidentally
# start crawling. Add the profile when you are ready to run the pipeline.
#
# The model runs on the HOST (llama-server on :8080), not in a container, so it
# keeps direct GPU access. Containers reach it via host.docker.internal, mapped
# to the host gateway below — inside a container "localhost" is the container.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consiva
      # Same clock as the other containers: NOW() feeds run durations and the
      # daily lead count, and a mismatch there is invisible until a duration
      # comes out negative.
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately NOT published to the host. Everything that needs the
    # database reaches it over the compose network as "postgres:5432", and this
    # machine already has other postgres containers holding 5432-5434.
    # For a shell: docker compose exec postgres psql -U postgres consiva
    # To expose it anyway (DBeaver from another machine), uncomment:
    #   ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5455}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consiva"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env.docker
    environment:
      # Containers are UTC unless told otherwise, which made RUN_AT=06:30 fire
      # at noon IST and printed every log line 5h30m off the host's clock.
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
    # Runs once on every `up`, then exits. Idempotent: a no-op when the schema
    # is current, so it is safe to leave in the startup path.
    command: python migrate.py
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # Containers are UTC unless told otherwise, which made RUN_AT=06:30 fire
      # at noon IST and printed every log line 5h30m off the host's clock.
      TZ: ${TZ:-Asia/Kolkata}
    # Four worker processes. The API is I/O-bound on Postgres and each worker
    # holds its own connection pool, so this is about concurrent requests, not
    # CPU. Override with API_WORKERS.
    command: >
      sh -c "uvicorn api:app --host 0.0.0.0 --port 8012
             --workers ${API_WORKERS:-4} --proxy-headers"
    ports:
      - "8012:8012"
    # Read-only: /partner shows whether data/partner.pause is set.
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8012/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    profiles: ["pipeline"]      # only starts with --profile pipeline
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # Containers are UTC unless told otherwise, which made RUN_AT=06:30 fire
      # at noon IST and printed every log line 5h30m off the host's clock.
      TZ: ${TZ:-Asia/Kolkata}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Resolve website lookups against public DNS rather than the office
    # gateway. systemd-resolved on the LAN was measured flapping between
    # 172.16.10.1, 8.8.8.8 and 8.8.4.4 every ~15s, and a lookup that fails
    # with EAI_AGAIN during a flap used to be recorded as "this company has
    # no website" -- permanently, after three such failures.
    #
    # This does not affect service discovery: compose puts these containers on
    # a user-defined network where Docker's embedded resolver (127.0.0.11)
    # still answers for "postgres"; only external names are forwarded here.
    # Our own recursive resolver. Public resolvers throttle the ~90 lookups/sec
    # of mostly-NXDOMAIN traffic this pipeline generates; recursing ourselves
    # means talking to the roots and TLD servers, which do not ration us.
    # 1.1.1.1 stays as a fallback so unbound dying degrades rather than breaks.
    dns:
      - 172.28.0.53
      - 1.1.1.1
    depends_on:
      migrate:
        condition: service_completed_successfully
      unbound:
        # service_started, not service_healthy: the healthcheck below depends on
        # a lookup tool being present in the image, and a scheduler that cannot
        # start is worse than one that briefly falls back to 1.1.1.1.
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # shm is tiny by default and Chromium crashes on it under concurrency.
    shm_size: 1gb
    command: python scheduler.py

  reports:
    # One-page DPDP report job for PartnerImport leads (docs/REPORTS.md).
    # Its own image and its own profile: `up`, with or without the pipeline
    # profile, never starts it, and building it never touches the scheduler
    # or API images. Run it on demand:
    #   docker compose --profile reports run --rm reports python report_build.py --dry-run --limit 1
    # The repo is mounted, so a code change needs no rebuild; only a change to
    # requirements-reports.txt does.
    build:
      context: .
      dockerfile: Dockerfile.reports
    image: consiva-scrapper-reports
    profiles: ["reports"]
    env_file: .env.docker
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Public resolvers, not the pipeline's unbound. Our own recursion answers
    # NXDOMAIN for sites behind some CDNs (www.bisleri.com, www.biba.in,
    # www.arvind.com -- cc-ecdn.net / induscdn.com chains), which failed those
    # reports outright; 1.1.1.1 / 8.8.8.8 resolve them. A report run is a few
    # thousand lookups, far below the volume the pipeline self-hosts for.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - .:/app
    working_dir: /app
    shm_size: 1gb
    command: python report_build.py --help

  campaign:
    # Auto Email Campaign scheduler (campaign/): drafts one first email per PartnerImport
    # company. Its own image and its own profile, so `up` never starts it and building it touches
    # no other service. It needs only Postgres (apply migrations first: `docker compose run --rm migrate`).
    # The CRM is written only through campaign/crm_write.py (status, report and AE_ columns, PartnerImport
    # rows, never test companies); nothing is ever sent. Production companies are not processed until
    # AE_PRODUCTION_ENABLED=1 (the scheduled run only takes them in).
    #   docker compose --profile campaign build campaign
    #   docker compose --profile campaign up -d campaign
    #   docker compose --profile campaign run --rm --no-deps campaign python -m campaign.jobs prepare --dry-run
    # The repo is mounted, so a code change needs no rebuild; only a change to a requirements file does.
    build:
      context: .
      dockerfile: Dockerfile.campaign
    image: consiva-scrapper-campaign
    profiles: ["campaign"]
    restart: unless-stopped
    env_file: .env.docker
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Public resolvers, as for the reports service: the pipeline's own unbound answers NXDOMAIN for
    # sites behind some CDNs, which would fail scans and MX lookups that should succeed.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - .:/app
    working_dir: /app
    shm_size: 1gb
    command: supercronic /app/campaign/crontab

  unbound:
    # Built here rather than pulled: mvance/unbound is amd64 and
    # mvance/unbound-rpi is 32-bit ARMv7, and this host is arm64 -- the second
    # died with "exec format error". Alpine has a real arm64 base, so this
    # builds natively wherever it runs.
    build: ./deploy/unbound
    restart: unless-stopped
    # Fixed address because Docker's `dns:` takes addresses, not service names.
    networks:
      default:
        ipv4_address: 172.28.0.53
    healthcheck:
      # Informational only -- nothing blocks on it. Uses whichever tool the
      # image ships; if neither exists the container still serves DNS fine.
      test: ["CMD-SHELL", "drill @127.0.0.1 cloudflare.com >/dev/null 2>&1 || dig @127.0.0.1 cloudflare.com +short >/dev/null 2>&1 || nslookup cloudflare.com 127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  # An explicit subnet so unbound can hold a fixed address.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
