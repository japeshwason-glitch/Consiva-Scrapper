helps:
  - title: Cookie and tracker discovery
    text: Categorises every cookie and tracker on your site by purpose.
  - title: DPDP consent banner
    text: Notice of data and purpose, in English and Indian languages.
  - title: Provable consent records
    text: Each consent and withdrawal logged with notice version and time.
  - title: Easy withdrawal
    text: Visitors change or withdraw consent as easily as they gave it.
  - title: Privacy notice and requests
    text: Publish privacy information; handle data requests in one place.
  - title: Quick to deploy
    text: One script tag, WordPress plugin or Shopify app.
